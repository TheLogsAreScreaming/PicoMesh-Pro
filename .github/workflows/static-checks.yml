name: Source-level regression checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record tested commit
        run: |
          echo "Commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME"
          python --version
      - name: Run source-level regression checks
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee source-test-results.txt
      - name: Upload source test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-test-results
          path: source-test-results.txt
          if-no-files-found: warn
          retention-days: 14

  mmbasic-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MMB4L_VERSION: 0.8-alpha.1
      MMB4L_SHA256: 017b0d9088ccddf0994b5669007be579cde1556d24b677efcd76a8e6a9db8624
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MMB4L (MMBasic for Linux, not PicoMite firmware)
        run: |
          name="mmb4l-${MMB4L_VERSION}-x86_64-glibc-2.29"
          curl -fsSL -o mmb4l.tgz "https://github.com/thwill1000/mmb4l/releases/download/v${MMB4L_VERSION}/${name}.tgz"
          echo "${MMB4L_SHA256}  mmb4l.tgz" | sha256sum -c -
          mkdir "$RUNNER_TEMP/mmb4l"
          tar xzf mmb4l.tgz -C "$RUNNER_TEMP/mmb4l" --strip-components=1
      - name: Run pure MMBasic functions
        run: python tests/mmbasic/check_pure_functions.py "$RUNNER_TEMP/mmb4l/mmbasic"
